<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add-Product</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>
    <div class="add-product-container">
        <h1>Sửa Sản Phẩm</h1>

        <div id="loading" class="loading hidden"> ⏳ Đang tải sản phẩm</div>
        <div id="error-message" class="error-message hidden"></div>

        <form id="edit-product-form">

            <div class="form-group">
                <label for="name">Tên sản phẩm</label>
                <input type="text" id="name" name="name" placeholder="Nhập tên sản phẩm">
                <p id="name-error" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="price">Giá</label>
                <input type="number" id="price" name="price" placeholder="Nhập giá sản phẩm">
                <p id="price-error" class="error-message"></p>
            </div>

            <div class="form-group">
                <label>
                    Ảnh hiện tại
                    <span class="field-hint">(bấm × để xóa, ảnh đầu tiên là ảnh chính)</span>
                </label>
                <div id="current-images" class="image-previews"></div>
            </div>

            <div class="form-group">
                <label for="image">
                    Thêm ảnh mới
                    <span class="field-hint">(tối đa 6 ảnh cho mỗi sản phẩm, mỗi ảnh dưới 5MB)</span>
                </label>
                <input type="file" id="image" name="images" accept="image/*" multiple>
                <div id="image-previews" class="image-previews"></div>
                <p id="image-error" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="description">Mô tả</label>
                <textarea id="description" name="description" placeholder="Nhập mô tả sản phẩm"></textarea>
                <p id="description-error" class="error-message"></p>
            </div>

            <button type="submit" id="submit-button" class="edit-product-button">
                Cập nhật sản phẩm
            </button>
            <div id="update-loading" class="loading hidden">
                Đang cập nhật sản phẩm...
            </div>
        </form>
        <a href="/admin" class="back-admin"> ← Quay lại Admin </a>
    </div>

    <script src="/js/admin/image-picker.js"></script>
    <script src="/js/admin/edit-product.js"></script>
</body>

</html>
